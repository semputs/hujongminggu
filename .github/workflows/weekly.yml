name: Weekly Curator Agent

on:
  schedule:
    # Runs every Thursday at 10:00 AM UTC (6:00 PM MYT)
    - cron: '0 10 * * 4'
  workflow_dispatch: # Allows manual trigger testing from GitHub UI

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Curator Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python curator_agent.py
